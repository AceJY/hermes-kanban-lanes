name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install build and test tooling
        run: python -m pip install pytest setuptools wheel

      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation -w dist

      - name: Install wheel
        run: python -m pip install dist/*.whl

      - name: Public export is clean
        run: python tools/public_export.py --out "${RUNNER_TEMP}/hkl-public"

      - name: Wheel bytes are reproducible
        run: python tools/build_wheel.py --out "${RUNNER_TEMP}/hkl-repro" --runs 2

      - name: Unit and integration tests (macOS)
        if: runner.os == 'macOS'
        run: python -m pytest tests -q

      - name: Unit and integration tests (no launchd)
        if: runner.os == 'Linux'
        run: python -m pytest tests -q --ignore=tests/unit/test_w6_service.py

      - name: CLI version smoke
        run: hermes-kanban-lanes --version

      - name: CLI doctor help smoke
        run: hermes-kanban-lanes doctor --help

      - name: Dependency check
        run: python -m pip check
