[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-kanban-lanes"
version = "0.1.0"
description = "Fail-closed command-line tooling for validating, running and operating Hermes Kanban lanes."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Acelogic" }]
requires-python = ">=3.13"
dependencies = ["PyYAML>=6"]
keywords = ["hermes", "kanban", "cli", "automation", "fail-closed"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/AceJY/hermes-kanban-lanes"
Repository = "https://github.com/AceJY/hermes-kanban-lanes"

[project.scripts]
hermes-kanban-lanes = "hermes_kanban_lanes.cli:main"

[project.entry-points."hermes_agent.plugins"]
hermes-kanban-lanes = "hermes_kanban_lanes.plugin"

[tool.setuptools]
package-dir = { "" = "src" }
packages = [
    "hermes_kanban_lanes",
    "hermes_kanban_lanes.hermes_adapter",
    "hermes_kanban_lanes.runtime",
    "hermes_kanban_lanes.executors",
    "hermes_kanban_lanes.verification",
    "hermes_kanban_lanes.workspace",
    "hermes_kanban_lanes.release",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
